<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Album of the Day</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232A44F5'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23F0481F'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23F2C500'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: a record-club ledger. One column of dated entries, mono for the
   catalogue facts, and three inks, one per friend, so you can tell who said what
   at a glance. Album sleeves are generated from the title since no cover art can load. */
:root {
  --paper: #E8EBF0;
  --card: #F5F6F9;
  --fg: #0F1224;
  --muted: #5A6075;
  --rule: #B9BECB;
  --j: #F0481F;   --on-j: #0F1224;
  --n: #2A44F5;   --on-n: #FFFFFF;
  --i: #F2C500;   --on-i: #0F1224;
  --o: #0E8A72;   --on-o: #FFFFFF;
  --focus: #2A44F5;
  --scrim: rgba(15, 18, 36, .55);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D0F1E; --card: #171A2E; --fg: #ECEEF6; --muted: #98A0BA; --rule: #333857;
    --j: #FF6A47; --n: #7B90FF; --i: #F5CF2E; --o: #2FC4A5;
    --on-j: #0D0F1E; --on-n: #0D0F1E; --on-i: #0D0F1E; --on-o: #0D0F1E;
    --focus: #9FB0FF; --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D0F1E; --card: #171A2E; --fg: #ECEEF6; --muted: #98A0BA; --rule: #333857;
  --j: #FF6A47; --n: #7B90FF; --i: #F5CF2E; --o: #2FC4A5;
  --on-j: #0D0F1E; --on-n: #0D0F1E; --on-i: #0D0F1E; --on-o: #0D0F1E;
  --focus: #9FB0FF; --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--paper); color: var(--fg);
  font-family: var(--display); font-size: 15px; line-height: 1.5; font-optical-sizing: auto;
}
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
.mono { font-family: var(--mono); }
.p-j { --c: var(--j); --on: var(--on-j); }
.p-n { --c: var(--n); --on: var(--on-n); }
.p-i { --c: var(--i); --on: var(--on-i); }
.p-o { --c: var(--o); --on: var(--on-o); }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.top > div { min-width: 0; }
h1 {
  margin: 0; font-weight: 800; font-stretch: 75%; text-transform: uppercase;
  font-size: clamp(40px, 9vw, 68px); line-height: .88; letter-spacing: -.02em;
}
.stats { margin: 10px 0 0; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.who {
  display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--fg); background: var(--card);
  padding: 6px 10px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.who .tag { font-size: 12px; }

/* nav */
.nav { display: flex; gap: 4px 24px; margin-top: 28px; border-bottom: 1.5px solid var(--fg); flex-wrap: wrap; }
.nav a {
  text-decoration: none; padding: 10px 0 9px; font: 600 14px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -1.5px;
}
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.nav .count { font-weight: 400; margin-left: 6px; }

/* controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border: 1.5px solid var(--fg); background: transparent; font-weight: 600; text-decoration: none; font-size: 14px;
}
.btn:hover { background: var(--card); }
.btn.primary { background: var(--fg); color: var(--paper); }
.btn.primary:hover { opacity: .88; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.quiet { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; padding-inline: 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.tag {
  display: inline-block; padding: 2px 7px; background: var(--c, var(--fg)); color: var(--on, var(--paper));
  font: 500 11px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.tag.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 12.5px var(--mono); padding: 1px 8px; border: 1px solid var(--rule); background: var(--card); overflow-wrap: anywhere; }
.chip button { border: 0; background: none; padding: 0 0 0 6px; color: var(--muted); font-size: 14px; line-height: 1; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 24px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  border: 1.5px solid var(--fg); background: transparent; padding: 4px 12px; min-height: 32px;
  font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.filters button[aria-pressed="true"] { background: var(--c, var(--fg)); color: var(--on, var(--paper)); }

.banner { margin-top: 20px; padding: 10px 14px; border: 1.5px dashed var(--fg); font: 400 13px var(--mono); }
.today {
  margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
  padding: 16px 18px; background: var(--fg); color: var(--paper);
}
.today .btn { border-color: var(--paper); color: var(--paper); }
.today .btn:hover { background: color-mix(in srgb, var(--paper) 14%, transparent); }
.today p { margin: 0; }
.today .d { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.today .m { font-size: 20px; font-weight: 700; font-stretch: 85%; }

/* entries */
.feed { margin-top: 12px; }
.entry { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 20px; padding: 24px 0; border-top: 1px solid var(--rule); }
.entry:first-child { border-top: 0; }
.sleeve { display: block; width: 100%; aspect-ratio: 1; border: 1.5px solid var(--fg); background: var(--card); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.entry h3, .row h3 {
  margin: 8px 0 0; font-weight: 750; font-stretch: 82%; font-size: clamp(24px, 5vw, 34px); line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere;
}
.by { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.takes { margin-top: 14px; display: grid; gap: 10px; }
.take { display: grid; grid-template-columns: 64px 50px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.take .tag { justify-self: start; }
.rating { font: 600 18px var(--mono); font-variant-numeric: tabular-nums; }
.rating.none { color: var(--muted); font-weight: 400; }
.note { margin: 6px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.acts { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.empty { margin-top: 28px; padding: 36px 20px; border: 1.5px dashed var(--fg); text-align: center; }
.empty h2 { margin: 0; font-size: 26px; font-weight: 750; font-stretch: 80%; }
.empty p { margin: 8px auto 18px; max-width: 42ch; color: var(--muted); }

/* list rows (queue, ranking) */
.row { display: grid; grid-template-columns: 44px 72px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--rule); }
.row.q { grid-template-columns: 72px minmax(0, 1fr) auto; }
.row:first-child { border-top: 0; }
.row h3 { font-size: 22px; margin-top: 4px; }
.row .by { font-size: 14px; margin-top: 2px; }
.pos { font: 600 26px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.row .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row .stat { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
.sub { margin: 28px 0 0; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 600px) {
  .entry { grid-template-columns: 76px minmax(0, 1fr); gap: 14px; }
  .take { grid-template-columns: 58px 44px minmax(0, 1fr); gap: 8px; }
  .row { grid-template-columns: 30px 56px minmax(0, 1fr); }
  .row.q { grid-template-columns: 56px minmax(0, 1fr); }
  .row > .tools { grid-column: 1 / -1; justify-content: flex-start; }
  .pos { font-size: 20px; }
}

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
#sheet.open { display: flex; }
.panel {
  width: 100%; max-width: 540px; max-height: 100%; overflow-y: auto; background: var(--paper); border: 1.5px solid var(--fg);
  padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px));
}
.panel h2 { margin: 0 0 4px; font-size: 28px; font-weight: 800; font-stretch: 78%; text-transform: uppercase; line-height: 1; }
.panel .lede { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 5px; margin-top: 14px; min-width: 0; }
.field > label, .field > .lab, .sec { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec { margin: 22px 0 0; padding-top: 14px; border-top: 1.5px solid var(--fg); color: var(--fg); }
.field input, .field textarea {
  width: 100%; min-width: 0; padding: 9px 10px; border: 1.5px solid var(--fg); background: var(--card); border-radius: 0; font-size: 16px;
}
.field textarea { resize: vertical; min-height: 64px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid2 > .field { margin-top: 14px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1.5px solid var(--fg); background: transparent; min-height: 36px; padding: 4px 12px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.pick[aria-pressed="true"] { background: var(--c, var(--fg)); color: var(--on, var(--paper)); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; align-items: center; }
.foot .spacer { flex: 1; }
details.more { margin-top: 14px; border: 1px solid var(--rule); padding: 8px 12px; }
details.more summary { cursor: pointer; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.danger { border-color: var(--j); color: var(--j); }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 16px; }
.versus .card { min-width: 0; }
.versus .card .t { margin: 8px 0 0; font-weight: 750; font-stretch: 85%; font-size: 18px; line-height: 1.1; overflow-wrap: anywhere; }
.versus .card .a { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.stack { display: grid; gap: 8px; margin-top: 16px; }
.stack .btn { justify-content: flex-start; text-align: left; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--paper); padding: 10px 16px; font: 500 13px var(--mono); max-width: calc(100vw - 32px); display: none;
}
#toast.show { display: block; }
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="wrap"><div id="app"></div></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Album form"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* Storage layer. The app below talks to a Firestore-shaped database. With a Firebase
   config (config.js) that is the real, shared Firestore. Without one it falls back to
   a copy kept in this browser only, so the page still works while you set things up. */
(() => {
  if (window.claude && window.claude.use) return;
  const cfg = window.AOTD_FIREBASE || {};
  const finish = (db, mode) => { window.claude = { mode, use: async n => (n === 'db' ? db : null) }; };

  function localDb() {
    const KEY = 'aotd-local-db';
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
    const write = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
    const subs = new Set();
    const snapOf = (name, d) => {
      const docs = Object.entries(d[name] || {}).map(([id, v]) => ({ id, data: () => JSON.parse(JSON.stringify(v)) }));
      return { docs, size: docs.length, metadata: { fromCache: false } };
    };
    const notify = () => { const d = read(); subs.forEach(s => s.next(snapOf(s.name, d))); };
    window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
    const rid = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4);
    const ref = (name, id) => ({
      id, path: name + '/' + id,
      async set(data) { const d = read(); (d[name] ||= {})[id] = JSON.parse(JSON.stringify(data)); write(d); notify(); },
      async update(data) {
        const d = read(); if (!d[name] || !d[name][id]) throw { code: 'not-found', message: 'No such document' };
        Object.assign(d[name][id], JSON.parse(JSON.stringify(data))); write(d); notify();
      },
      async delete() { const d = read(); if (d[name]) delete d[name][id]; write(d); notify(); },
    });
    return {
      collection: name => ({
        doc: id => ref(name, id || rid()),
        onSnapshot(next) { const s = { name, next }; subs.add(s); Promise.resolve().then(() => next(snapOf(name, read()))); return () => subs.delete(s); },
      }),
      doc: path => { const [name, id] = path.split('/'); return ref(name, id); },
    };
  }

  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
  if (cfg.projectId) {
    const V = '10.12.5';
    window.claude = {
      mode: 'cloud',
      use: async n => {
        if (n !== 'db') return null;
        try {
          await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
          await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
          if (!firebase.apps.length) firebase.initializeApp(cfg);
          return firebase.firestore();
        } catch { return null; }
      },
    };
  } else finish(localDb(), 'local');
})();
</script>
<script>
(() => {
  const PEOPLE = [{ key: 'jonah', name: 'Jonah' }, { key: 'nico', name: 'Nico' }, { key: 'isaac', name: 'Isaac' }];
  const TABS = ['log', 'queue', 'ranking'];
  const S = {
    me: null, tab: 'log', albums: [], logs: [], ranks: {}, got: {}, status: 'loading', slow: false,
    canWrite: true, qFilter: 'all', rankView: 'group', sheet: null, db: null,
  };
  let D = null;

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'friend';
  const pcls = key => ({ jonah: 'p-j', nico: 'p-n', isaac: 'p-i' }[key] || 'p-o');
  const $ = id => document.getElementById(id);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtDate = iso => {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  };
  const fmtRating = n => (+n).toFixed(1);
  const spotify = a => `https://open.spotify.com/search/${encodeURIComponent(a.artist + ' ' + a.title)}`;

  try { const m = JSON.parse(ls.get('aotd-me') || 'null'); if (m && m.name) S.me = { name: m.name, key: slug(m.name) }; } catch {}

  /* ---------- sleeves ---------- */
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function sleeve(a) {
    const r = rng(hash(a.title + '|' + a.artist));
    const inks = ['var(--j)', 'var(--n)', 'var(--i)', 'var(--fg)', 'var(--o)'];
    const pick = (not = []) => { let c; do { c = inks[Math.floor(r() * inks.length)]; } while (not.includes(c)); return c; };
    const c1 = pick(), c2 = pick([c1]), c3 = pick([c1, c2]);
    const f = c => `style="fill:${c}"`;
    const kind = Math.floor(r() * 6);
    let body = `<rect width="100" height="100" ${f(c1)}/>`;
    if (kind === 0) body += `<circle cx="50" cy="50" r="34" ${f(c2)}/><circle cx="${30 + Math.floor(r() * 40)}" cy="${30 + Math.floor(r() * 40)}" r="10" ${f(c3)}/>`;
    else if (kind === 1) body += `<rect width="50" height="100" ${f(c2)}/><circle cx="50" cy="50" r="22" ${f(c3)}/>`;
    else if (kind === 2) body += [0, 2, 4, 6, 8].map(i => `<rect y="${i * 10}" width="100" height="10" ${f(i % 4 === 0 ? c2 : c3)}/>`).join('');
    else if (kind === 3) body += `<circle cx="50" cy="50" r="46" ${f(c2)}/><circle cx="50" cy="50" r="32" ${f(c1)}/><circle cx="50" cy="50" r="18" ${f(c3)}/>`;
    else if (kind === 4) { for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) body += `<circle cx="${14 + x * 24}" cy="${14 + y * 24}" r="${6 + Math.floor(r() * 5)}" ${f((x + y) % 2 ? c2 : c3)}/>`; }
    else body += `<polygon points="0,100 100,0 100,100" ${f(c2)}/><circle cx="25" cy="25" r="16" ${f(c3)}/>`;
    return `<svg class="sleeve" viewBox="0 0 100 100" role="img" aria-label="Generated sleeve for ${esc(a.title)}">${body}</svg>`;
  }

  /* ---------- derived data ---------- */
  function nameOf(key) {
    const p = PEOPLE.find(p => p.key === key); if (p) return p.name;
    const l = S.logs.find(l => slug(l.person) === key); if (l) return l.person;
    return (S.ranks[key] && S.ranks[key].name) || key;
  }
  function derive() {
    const byId = new Map(S.albums.map(a => [a.id, { ...a }]));
    const all = [...byId.values()];
    const listened = all.filter(a => a.status === 'listened')
      .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.addedAt || 0) - (b.addedAt || 0));
    listened.forEach((a, i) => { a.no = i + 1; });
    const queue = all.filter(a => a.status !== 'listened').sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
    const order = k => { const i = PEOPLE.findIndex(p => p.key === k); return i < 0 ? 99 : i; };
    const logsBy = {};
    S.logs.forEach(l => { (logsBy[l.albumId] ||= []).push(l); });
    Object.values(logsBy).forEach(arr => arr.sort((a, b) => order(slug(a.person)) - order(slug(b.person)) || a.person.localeCompare(b.person)));
    const orders = {};
    for (const [k, v] of Object.entries(S.ranks)) orders[k] = (v.order || []).filter(id => byId.has(id) && byId.get(id).status === 'listened');
    const sc = {};
    for (const ord of Object.values(orders)) {
      const n = ord.length;
      ord.forEach((id, i) => { const s = (sc[id] ||= { sum: 0, count: 0 }); s.sum += (n - i - 0.5) / n; s.count++; });
    }
    const avg = id => { const rs = (logsBy[id] || []).map(l => l.rating).filter(x => typeof x === 'number'); return rs.length ? rs.reduce((x, y) => x + y, 0) / rs.length : null; };
    const group = listened.filter(a => sc[a.id])
      .map(a => ({ a, score: sc[a.id].sum / sc[a.id].count, count: sc[a.id].count, avg: avg(a.id) }))
      .sort((x, y) => y.score - x.score || (y.avg ?? -1) - (x.avg ?? -1) || x.a.no - y.a.no);
    const groupRank = {}; group.forEach((g, i) => { groupRank[g.a.id] = i + 1; });
    D = { byId, listened, queue, logsBy, orders, group, groupRank, avg };
  }
  const peopleKeys = () => {
    const keys = PEOPLE.map(p => p.key);
    S.logs.forEach(l => { const k = slug(l.person); if (!keys.includes(k)) keys.push(k); });
    Object.keys(S.ranks).forEach(k => { if (!keys.includes(k)) keys.push(k); });
    return keys;
  };

  /* ---------- views ---------- */
  function render() {
    derive();
    const nL = D.listened.length, nQ = D.queue.length;
    const me = S.me ? `<button class="who ${pcls(S.me.key)}" type="button" data-act="who" aria-label="Change who is logging"><span class="tag">${esc(S.me.name)}</span>Listening as</button>`
      : `<button class="who" type="button" data-act="who">Who are you?</button>`;
    let banner = '';
    if (S.status === 'nodb') banner = `<p class="banner">Can't reach the shared log. Check your connection and reload.</p>`;
    else if (window.claude && window.claude.mode === 'local') banner = `<p class="banner">Not connected to a shared database yet. Albums you add are saved in this browser only. The README explains how to connect one so everyone sees the same log.</p>`;
    else if (S.slow) banner = `<p class="banner">Still reaching the shared log. What you see may be out of date.</p>`;
    const nav = `<nav class="nav" aria-label="Sections">
      <a href="#log" ${S.tab === 'log' ? 'aria-current="page"' : ''}>Log<span class="count">${nL}</span></a>
      <a href="#queue" ${S.tab === 'queue' ? 'aria-current="page"' : ''}>Up next<span class="count">${nQ}</span></a>
      <a href="#ranking" ${S.tab === 'ranking' ? 'aria-current="page"' : ''}>Ranking<span class="count">${D.group.length}</span></a></nav>`;
    const view = S.status === 'loading' && !S.got.albums ? `<p class="banner">Loading the log…</p>` : S.tab === 'queue' ? viewQueue() : S.tab === 'ranking' ? viewRanking() : viewLog();
    $('app').innerHTML = `<header class="top"><div><h1>Album of<br>the Day</h1>
      <p class="stats">${nL} logged · ${nQ} up next · ${peopleKeys().length} listeners</p></div>${me}</header>${banner}${nav}${view}`;
  }

  const w = () => S.canWrite && S.status !== 'nodb';

  function viewLog() {
    const t = today();
    const hasToday = D.listened.some(a => a.date === t);
    const strip = w() && !hasToday ? `<div class="today"><div><p class="d">${esc(fmtDate(t))}</p><p class="m">Nothing logged for today yet.</p></div>
      <button class="btn" type="button" data-act="log-new">Log today's album</button></div>` : '';
    if (!D.listened.length) {
      return strip + `<div class="empty"><h2>No albums logged yet</h2><p>Log the first album of the day. It shows up here for everyone, with each person's rating and favorite songs.</p>
        ${w() ? `<button class="btn primary" type="button" data-act="log-new">Log an album</button>` : ''}</div>`;
    }
    const entries = [...D.listened].reverse().map(a => {
      const takes = D.logsBy[a.id] || [];
      const mine = S.me && takes.find(l => slug(l.person) === S.me.key);
      const gr = D.groupRank[a.id];
      const takeHtml = takes.map(l => {
        const k = slug(l.person);
        return `<div class="take ${pcls(k)}"><span class="tag">${esc(l.person)}</span>
          <span class="rating ${typeof l.rating === 'number' ? '' : 'none'}">${typeof l.rating === 'number' ? fmtRating(l.rating) : '—'}</span>
          <div>${(l.favorites || []).length ? `<div class="chips">${l.favorites.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>` : ''}
          ${l.note ? `<p class="note">${esc(l.note)}</p>` : ''}</div></div>`;
      }).join('');
      return `<article class="entry"><div>${sleeve(a)}</div><div style="min-width:0">
        <div class="meta"><span>№ ${String(a.no).padStart(3, '0')}</span><span>${esc(fmtDate(a.date))}</span>
          ${a.date === today() ? '<span class="tag">Today</span>' : ''}
          ${a.suggestedBy ? `<span class="tag ${pcls(slug(a.suggestedBy))}">Suggested by ${esc(a.suggestedBy)}</span>` : ''}
          ${gr ? `<span>Group #${gr} of ${D.group.length}</span>` : ''}</div>
        <h3>${esc(a.title)}</h3>
        <p class="by">${esc(a.artist)}${a.year ? ` · ${esc(a.year)}` : ''}</p>
        ${takes.length ? `<div class="takes">${takeHtml}</div>` : ''}
        <div class="acts">${w() ? `<button class="btn small" type="button" data-act="log-take" data-id="${a.id}">${mine ? 'Edit my take' : 'Add my take'}</button>` : ''}
          <a class="btn small" href="${spotify(a)}" target="_blank" rel="noopener">Find on Spotify ↗</a></div></div></article>`;
    }).join('');
    return `${strip}<div class="bar"><p class="sub" style="margin:0">Newest first</p>${w() ? `<button class="btn primary" type="button" data-act="log-new">Log an album</button>` : ''}</div><div class="feed">${entries}</div>`;
  }

  function viewQueue() {
    const f = S.qFilter;
    const filters = ['all', ...PEOPLE.map(p => p.key)].map(k =>
      `<button type="button" class="${k === 'all' ? '' : pcls(k)}" data-act="qfilter" data-k="${k}" aria-pressed="${f === k}">${k === 'all' ? 'All' : esc(nameOf(k))}</button>`).join('');
    const list = D.queue.filter(a => f === 'all' || slug(a.suggestedBy || '') === f);
    const head = `<div class="bar"><div class="filters" role="group" aria-label="Filter by who suggested">${filters}</div>
      ${w() ? `<button class="btn primary" type="button" data-act="queue-new">Add an album</button>` : ''}</div>`;
    if (!D.queue.length) return head + `<div class="empty"><h2>The queue is empty</h2><p>Add the albums you want the group to hear next and tag who suggested them.</p></div>`;
    if (!list.length) return head + `<div class="empty"><h2>Nothing from ${esc(nameOf(f))}</h2><p>No queued album carries that name.</p></div>`;
    return head + `<div class="feed">${list.map((a, i) => `<div class="row q"><div>${sleeve(a)}</div><div style="min-width:0">
      <div class="meta">${i === 0 && f === 'all' ? '<span class="tag">Next</span>' : ''}${a.suggestedBy ? `<span class="tag ${pcls(slug(a.suggestedBy))}">Suggested by ${esc(a.suggestedBy)}</span>` : '<span>No suggester</span>'}</div>
      <h3>${esc(a.title)}</h3><p class="by">${esc(a.artist)}${a.year ? ` · ${esc(a.year)}` : ''}</p></div>
      <div class="tools"><a class="btn small" href="${spotify(a)}" target="_blank" rel="noopener">Spotify ↗</a>
      ${w() ? `<button class="btn small" type="button" data-act="queue-edit" data-id="${a.id}">Edit</button><button class="btn small primary" type="button" data-act="log-take" data-id="${a.id}">Listen today</button>` : ''}</div></div>`).join('')}</div>`;
  }

  function viewRanking() {
    const keys = peopleKeys().filter(k => PEOPLE.some(p => p.key === k) || S.ranks[k]);
    const v = S.rankView === 'group' || !keys.includes(S.rankView) ? 'group' : S.rankView;
    const tabs = `<div class="filters" role="group" aria-label="Whose ranking">
      <button type="button" data-act="rview" data-k="group" aria-pressed="${v === 'group'}">Group</button>
      ${keys.map(k => `<button type="button" class="${pcls(k)}" data-act="rview" data-k="${k}" aria-pressed="${v === k}">${esc(nameOf(k))}</button>`).join('')}</div>`;
    let body = '';
    if (v === 'group') {
      if (!D.group.length) body = `<div class="empty"><h2>No rankings yet</h2><p>After you log an album you compare it against ones you've already ranked. The group list averages everyone's order.</p></div>`;
      else body = `<div class="feed">${D.group.map((g, i) => `<div class="row"><div class="pos">${i + 1}</div><div>${sleeve(g.a)}</div>
        <div style="min-width:0"><h3>${esc(g.a.title)}</h3><p class="by">${esc(g.a.artist)}${g.a.year ? ` · ${esc(g.a.year)}` : ''}</p>
        <p class="stat">Ranked by ${g.count} of ${keys.filter(k => (D.orders[k] || []).length).length}${g.avg !== null ? ` · avg rating ${fmtRating(g.avg)}` : ''}</p></div><div></div></div>`).join('')}</div>`;
    } else {
      const ord = D.orders[v] || [];
      const mineView = S.me && S.me.key === v && w();
      const rated = id => { const l = (D.logsBy[id] || []).find(l => slug(l.person) === v); return l && typeof l.rating === 'number' ? fmtRating(l.rating) : null; };
      body = ord.length ? `<div class="feed">${ord.map((id, i) => { const a = D.byId.get(id); return `<div class="row"><div class="pos">${i + 1}</div><div>${sleeve(a)}</div>
        <div style="min-width:0"><h3>${esc(a.title)}</h3><p class="by">${esc(a.artist)}</p>${rated(id) ? `<p class="stat">Rated ${rated(id)}</p>` : ''}</div>
        <div class="tools">${mineView ? `<button class="btn small" type="button" data-act="mv" data-id="${id}" data-dir="-1" aria-label="Move ${esc(a.title)} up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn small" type="button" data-act="mv" data-id="${id}" data-dir="1" aria-label="Move ${esc(a.title)} down" ${i === ord.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn small" type="button" data-act="rerank" data-id="${id}">Re-rank</button>` : ''}</div></div>`; }).join('')}</div>`
        : `<div class="empty"><h2>${esc(nameOf(v))} hasn't ranked anything</h2><p>Rankings start when an album is logged.</p></div>`;
      if (mineView) {
        const un = D.listened.filter(a => !ord.includes(a.id)).reverse();
        if (un.length) body += `<p class="sub">Not ranked yet</p><div class="feed">${un.map(a => `<div class="row q"><div>${sleeve(a)}</div><div style="min-width:0"><h3>${esc(a.title)}</h3><p class="by">${esc(a.artist)}</p></div>
          <div class="tools"><button class="btn small primary" type="button" data-act="rerank" data-id="${a.id}">Rank it</button></div></div>`).join('')}</div>`;
      }
    }
    return `<div class="bar">${tabs}</div>${body}`;
  }

  /* ---------- sheet ---------- */
  const sheetEl = $('sheet');
  function openSheet(html, focusId) {
    sheetEl.innerHTML = `<div class="panel">${html}</div>`;
    sheetEl.classList.add('open');
    const f = focusId && $(focusId); if (f) f.focus(); else { const p = sheetEl.querySelector('input, button'); if (p) p.focus(); }
  }
  function closeSheet() { S.sheet = null; sheetEl.classList.remove('open'); sheetEl.innerHTML = ''; }
  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
  const needDb = () => { if (S.db) return true; toast("Can't reach the shared log right now."); return false; };
  const fail = e => toast(`Couldn't save${e && e.code ? ` (${e.code})` : ''}. Try again.`);

  function needMe(then) {
    if (S.me) return true;
    S.sheet = { type: 'who', then };
    openSheet(whoHtml());
    return false;
  }
  function setMe(name) {
    name = name.trim().slice(0, 24); if (!name) return;
    S.me = { name, key: slug(name) };
    ls.set('aotd-me', JSON.stringify({ name }));
    const then = S.sheet && S.sheet.then;
    closeSheet(); render();
    if (then) then();
  }

  const suggestPicks = cur => `<div class="picks" id="sug" role="group" aria-label="Suggested by">
    ${PEOPLE.map(p => `<button type="button" class="pick ${pcls(p.key)}" data-act="sug" data-v="${p.name}" aria-pressed="${cur === p.name}">${p.name}</button>`).join('')}
    <button type="button" class="pick" data-act="sug" data-v="" aria-pressed="${!cur}">Nobody</button></div>`;
  const albumFields = a => `<div class="field"><label for="f-title">Album</label><input id="f-title" required maxlength="120" value="${esc(a.title || '')}" autocomplete="off"></div>
    <div class="grid2"><div class="field"><label for="f-artist">Artist</label><input id="f-artist" required maxlength="120" value="${esc(a.artist || '')}" autocomplete="off"></div>
    <div class="field"><label for="f-year">Year</label><input id="f-year" inputmode="numeric" maxlength="4" value="${esc(a.year || '')}" autocomplete="off"></div></div>
    <div class="field"><span class="lab">Suggested by</span>${suggestPicks(a.suggestedBy || '')}</div>`;
  const readAlbum = () => ({
    title: $('f-title').value.trim(), artist: $('f-artist').value.trim(),
    year: $('f-year').value.trim().replace(/\D/g, '').slice(0, 4), suggestedBy: S.sheet.suggested || '',
  });

  function openQueue(id) {
    if (!needMe(() => openQueue(id)) || !needDb()) return;
    const a = id ? D.byId.get(id) : null;
    S.sheet = { type: 'queue', id, suggested: a ? a.suggestedBy || '' : (PEOPLE.some(p => p.name === S.me.name) ? S.me.name : ''), armed: false };
    openSheet(`<form id="queue-form"><h2>${a ? 'Edit album' : 'Add to queue'}</h2><p class="lede">An album you want the group to hear later.</p>
      ${albumFields({ ...(a || {}), suggestedBy: S.sheet.suggested })}
      <div class="foot"><button class="btn primary" type="submit">${a ? 'Save' : 'Add to queue'}</button><button class="btn" type="button" data-act="close">Cancel</button>
      ${a ? `<span class="spacer"></span><button class="btn danger" type="button" data-act="del-queue">Remove</button>` : ''}</div></form>`, 'f-title');
  }

  function openLog(id) {
    if (!needMe(() => openLog(id)) || !needDb()) return;
    const a = id ? D.byId.get(id) : null;
    const mine = id ? (D.logsBy[id] || []).find(l => slug(l.person) === S.me.key) : null;
    S.sheet = { type: 'log', id, favs: [...((mine && mine.favorites) || [])], suggested: a ? a.suggestedBy || '' : '', armed: false };
    const dateVal = a && a.status === 'listened' && a.date ? a.date : today();
    const album = a ? `<details class="more"><summary>${esc(a.title)} · ${esc(a.artist)}, edit details</summary>${albumFields(a)}
        ${a.status === 'listened' ? `<div class="foot"><button class="btn danger small" type="button" data-act="del-album">Delete album from the log</button></div>` : ''}</details>`
      : `<p class="lede" style="margin-bottom:0">Add the album first, then your take.</p>${albumFields({})}`;
    openSheet(`<form id="log-form"><h2>${a ? (mine ? 'Edit my take' : 'My take') : 'Log an album'}</h2>
      <p class="lede">Listening as ${esc(S.me.name)}.</p>${album}
      <div class="field"><label for="f-date">Listened on</label><input id="f-date" type="date" required value="${dateVal}"></div>
      <p class="sec">${esc(S.me.name)}'s take</p>
      <div class="field"><label for="f-rating">Rating, 0 to 10 (optional)</label><input id="f-rating" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="${mine && typeof mine.rating === 'number' ? mine.rating : ''}" placeholder="Skip if you'd rather not"></div>
      <div class="field"><label for="f-fav">Favorite songs</label><div class="addrow"><input id="f-fav" maxlength="100" placeholder="Song title, then Enter" autocomplete="off"><button class="btn" type="button" data-act="addfav">Add</button></div>
        <div class="chips" id="favs"></div></div>
      <div class="field"><label for="f-note">A line about it (optional)</label><textarea id="f-note" maxlength="300">${esc((mine && mine.note) || '')}</textarea></div>
      <div class="foot"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>`, a ? 'f-rating' : 'f-title');
    renderFavs();
  }
  function renderFavs() {
    const el = $('favs'); if (!el || !S.sheet) return;
    el.innerHTML = S.sheet.favs.map((s, i) => `<span class="chip">${esc(s)}<button type="button" data-act="rmfav" data-i="${i}" aria-label="Remove ${esc(s)}">×</button></span>`).join('');
  }
  function addFav() {
    const inp = $('f-fav'); const v = inp.value.trim(); if (!v) return;
    if (!S.sheet.favs.some(f => f.toLowerCase() === v.toLowerCase())) S.sheet.favs.push(v);
    inp.value = ''; renderFavs(); inp.focus();
  }

  async function saveQueue(e) {
    e.preventDefault(); if (!needDb()) return;
    const f = readAlbum(); if (!f.title || !f.artist) return;
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      const col = S.db.collection('albums');
      if (S.sheet.id) await col.doc(S.sheet.id).update(f);
      else await col.doc().set({ ...f, status: 'queue', addedAt: Date.now(), addedBy: S.me.name });
      closeSheet(); toast('Saved.');
    } catch (err) { if (btn) btn.disabled = false; fail(err); }
  }
  async function saveLog(e) {
    e.preventDefault(); if (!needDb()) return;
    const f = readAlbum(); if (!f.title || !f.artist) { toast('Add the album title and artist.'); return; }
    const date = $('f-date').value || today();
    const rv = $('f-rating').value.trim();
    let rating = rv === '' ? null : Math.min(10, Math.max(0, Math.round(parseFloat(rv) * 10) / 10));
    if (Number.isNaN(rating)) rating = null;
    const pending = $('f-fav').value.trim(); if (pending) { $('f-fav').value = ''; if (!S.sheet.favs.some(x => x.toLowerCase() === pending.toLowerCase())) S.sheet.favs.push(pending); }
    const take = { person: S.me.name, rating, favorites: S.sheet.favs, note: $('f-note').value.trim(), at: Date.now() };
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      let id = S.sheet.id;
      if (id) await S.db.doc('albums/' + id).update({ ...f, status: 'listened', date });
      else { const ref = S.db.collection('albums').doc(); id = ref.id; await ref.set({ ...f, status: 'listened', date, addedAt: Date.now(), addedBy: S.me.name }); }
      await S.db.doc(`logs/${id}_${S.me.key}`).set({ albumId: id, ...take });
      const ranked = (D.orders[S.me.key] || []).includes(id);
      closeSheet(); toast('Logged.');
      if (!ranked) startRank(id);
    } catch (err) { if (btn) btn.disabled = false; fail(err); }
  }

  /* ---------- ranking by comparison ---------- */
  function startRank(albumId) {
    if (!needMe(() => startRank(albumId)) || !needDb()) return;
    const order = (D.orders[S.me.key] || []).filter(id => id !== albumId);
    S.sheet = { type: 'rank', albumId, order, lo: 0, hi: order.length, steps: 0, total: Math.max(1, Math.ceil(Math.log2(order.length + 1))) };
    if (!order.length) { finishRank(0); return; }
    renderRank();
  }
  function renderRank() {
    const sh = S.sheet, a = D.byId.get(sh.albumId); if (!a) { closeSheet(); return; }
    const mid = (sh.lo + sh.hi) >> 1, b = D.byId.get(sh.order[mid]);
    const card = (x, label) => `<div class="card">${sleeve(x)}<p class="t">${esc(x.title)}</p><p class="a">${esc(x.artist)}</p><p class="meta" style="margin-top:6px">${label}</p></div>`;
    openSheet(`<h2>Where does it land?</h2><p class="lede">Pick the better album. Question ${Math.min(sh.steps + 1, sh.total)} of about ${sh.total}.</p>
      <div class="versus">${card(a, 'Just logged')}${card(b, `Your #${mid + 1}`)}</div>
      <div class="stack"><button class="btn primary" type="button" data-act="rank-yes">${esc(a.title)} is better</button>
      <button class="btn" type="button" data-act="rank-no">${esc(b.title)} is better</button></div>
      <div class="foot"><button class="btn quiet" type="button" data-act="close">Skip for now</button></div>`, null);
  }
  function rankAnswer(better) {
    const sh = S.sheet; const mid = (sh.lo + sh.hi) >> 1;
    if (better) sh.hi = mid; else sh.lo = mid + 1;
    sh.steps++;
    if (sh.lo >= sh.hi) finishRank(sh.lo); else renderRank();
  }
  async function finishRank(pos) {
    const sh = S.sheet; const order = [...sh.order]; order.splice(pos, 0, sh.albumId);
    try { await S.db.doc('ranks/' + S.me.key).set({ name: S.me.name, order }); closeSheet(); toast(`Ranked #${pos + 1} of ${order.length} on your list.`); }
    catch (err) { fail(err); }
  }
  async function move(id, dir) {
    const ord = [...(D.orders[S.me.key] || [])]; const i = ord.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ord.length || !needDb()) return;
    [ord[i], ord[j]] = [ord[j], ord[i]];
    try { await S.db.doc('ranks/' + S.me.key).set({ name: S.me.name, order: ord }); } catch (err) { fail(err); }
  }

  async function deleteAlbum() {
    const id = S.sheet.id; if (!id || !needDb()) return;
    try {
      await Promise.all((D.logsBy[id] || []).map(l => S.db.doc(`logs/${id}_${slug(l.person)}`).delete()));
      await S.db.doc('albums/' + id).delete();
      closeSheet(); toast('Deleted.');
    } catch (err) { fail(err); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    if (e.target === sheetEl) { closeSheet(); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'who': S.sheet = { type: 'who', then: null }; openSheet(whoHtml()); break;
      case 'setme': setMe(el.dataset.name); break;
      case 'close': closeSheet(); break;
      case 'log-new': openLog(null); break;
      case 'log-take': openLog(id); break;
      case 'queue-new': openQueue(null); break;
      case 'queue-edit': openQueue(id); break;
      case 'qfilter': S.qFilter = el.dataset.k; render(); break;
      case 'rview': S.rankView = el.dataset.k; render(); break;
      case 'sug': {
        S.sheet.suggested = el.dataset.v;
        el.parentElement.querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
        break;
      }
      case 'addfav': addFav(); break;
      case 'rmfav': S.sheet.favs.splice(+el.dataset.i, 1); renderFavs(); break;
      case 'rank-yes': rankAnswer(true); break;
      case 'rank-no': rankAnswer(false); break;
      case 'rerank': startRank(id); break;
      case 'mv': move(id, +el.dataset.dir); break;
      case 'del-album': case 'del-queue':
        if (!S.sheet.armed) { S.sheet.armed = true; el.textContent = 'Really delete? Everyone\'s takes go too.'; } else deleteAlbum();
        break;
    }
  });
  function whoHtml() {
    return `<h2>Who's listening?</h2><p class="lede">Your name goes on the ratings and favorites you add. This browser remembers it.${S.me ? ` Currently ${esc(S.me.name)}.` : ''}</p>
      <div class="stack">${PEOPLE.map(p => `<button class="btn ${pcls(p.key)}" type="button" data-act="setme" data-name="${p.name}"><span class="tag">${p.name}</span> I'm ${p.name}</button>`).join('')}</div>
      <form class="field" id="other-form" style="margin-top:18px"><label for="other-name">Someone else</label>
        <div class="addrow"><input id="other-name" maxlength="24" placeholder="Your name" autocomplete="off"><button class="btn" type="submit">Use name</button></div></form>
      <div class="foot"><button class="btn quiet" type="button" data-act="close">Close</button></div>`;
  }
  document.addEventListener('submit', e => {
    const id = e.target.id;
    if (id === 'queue-form') saveQueue(e);
    else if (id === 'log-form') saveLog(e);
    else if (id === 'other-form') { e.preventDefault(); setMe($('other-name').value); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheetEl.classList.contains('open')) closeSheet();
    if (e.key === 'Enter' && e.target.id === 'f-fav') { e.preventDefault(); addFav(); }
  });
  function readHash() { const h = location.hash.slice(1); S.tab = TABS.includes(h) ? h : 'log'; }
  window.addEventListener('hashchange', () => { readHash(); render(); });

  /* ---------- data ---------- */
  async function boot() {
    readHash(); render();
    const c = window.claude;
    if (!c || !c.use) { S.status = 'nodb'; render(); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db) { S.status = 'nodb'; render(); return; }
    S.db = db;
    if (user) { try { const can = await user.can('data.write'); if (can === false) S.canWrite = false; } catch {} }
    const timer = setTimeout(() => { if (S.status !== 'ready') { S.slow = true; render(); } }, 10000);
    const need = ['albums', 'logs', 'ranks'];
    const sub = (name, apply) => db.collection(name).onSnapshot(snap => {
      apply(snap.docs);
      S.got[name] = true;
      if (need.every(n => S.got[n])) { S.status = 'ready'; S.slow = false; clearTimeout(timer); }
      refresh();
    }, err => { if (err && err.code === 'revoked') { S.status = 'nodb'; } else { S.slow = true; } render(); });
    sub('albums', ds => { S.albums = ds.map(d => ({ id: d.id, ...d.data() })); });
    sub('logs', ds => { S.logs = ds.map(d => ({ id: d.id, ...d.data() })); });
    sub('ranks', ds => { S.ranks = Object.fromEntries(ds.map(d => [d.id, d.data()])); });
  }
  let pending = false;
  function refresh() { if (pending) return; pending = true; queueMicrotask(() => { pending = false; render(); }); }
  boot();
})();
</script>
</body>
</html>
